plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.allnewmts'
version = '0.0.1'

def reactNativeArchitectures() {
  def value = project.getProperties().get('reactNativeArchitectures')
  return value ? value.split(',') : ['armeabi-v7a', 'x86', 'x86_64', 'arm64-v8a']
}

def verificationHarnessEnabled = System.getenv('EXPO_PUBLIC_NATIVE_HARNESS') == '1'

expoModule {
  canBePublished false
}

android {
  namespace 'com.allnewmts.lua'

  defaultConfig {
    versionCode 1
    versionName '0.0.1'
    externalNativeBuild {
      cmake {
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  sourceSets {
    main {
      java.srcDirs = ['src/main/java']
      if (verificationHarnessEnabled) java.srcDir 'src/verification/java'
    }
  }
}
